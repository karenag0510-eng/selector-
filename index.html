<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¡Crea tus tenis!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf6fb;--bg2:#f3ebfa;--fg:#4a3f66;--card:#ffffff;--mut:#9a8fb5;--line:#efe4f6;--acc:#ff9ec4;--acc2:#b9a2ff;--sh:0 12px 34px rgba(170,140,210,.18);--font:"Fredoka",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.nodark-unused{--bg:#241f33;--bg2:#2d2740;--fg:#f6eefc;--card:#322b47;--mut:#bba9d8;--line:#443a60;--sh:0 12px 34px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 520px at 5% -8%,rgba(255,120,180,.28),transparent),radial-gradient(900px 520px at 105% 0%,rgba(90,140,255,.25),transparent),var(--bg);color:var(--fg);font-family:var(--font);min-height:100vh}
.app{max-width:600px;margin:0 auto;padding:18px 16px 28px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:2px 2px 14px}
h1{font-size:1.55rem;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.02em}
h1 span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:5px 0 0;color:var(--mut);font-size:.82rem;font-weight:500}
.stage{position:relative;border-radius:28px;overflow:hidden;background:#dcdcdc;box-shadow:var(--sh);line-height:0;animation:in .7s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.985)}}
.stage canvas{width:100%;height:auto;display:block;cursor:pointer;touch-action:manipulation}
.stage canvas.top{position:absolute;inset:0;pointer-events:none}
.stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.22));border-radius:inherit}
.pin{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:2px solid #fff;opacity:.75;background:var(--c,#fff);box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:pointer;z-index:3;transition:transform .2s;line-height:0;padding:0}
.pin:hover{transform:scale(1.15)}
.pin.on{transform:scale(1.35);border-color:var(--acc);opacity:1}
.pin.on:before{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--acc);animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(1.35);opacity:0}}
.tag{position:absolute;z-index:4;pointer-events:none;background:var(--fg);color:var(--bg);font:700 .72rem/1 var(--font);padding:6px 10px;border-radius:99px;white-space:nowrap;transform:translate(-50%,-190%);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.hold{position:absolute;right:10px;bottom:10px;z-index:5;border:0;background:rgba(20,20,26,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font:600 .72rem/1 var(--font);padding:9px 12px;border-radius:99px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:16px 2px 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:9px 14px 9px 10px;border-radius:99px;font:600 .82rem var(--font);cursor:pointer;transition:.2s}
.tab i{width:16px;height:16px;border-radius:50%;background:var(--c);border:1px solid rgba(0,0,0,.25);flex:none}
.tab.on i{box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.tab.on{background:var(--fg);color:var(--bg);border-color:var(--fg);transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.22)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 14px 12px;margin-top:6px;box-shadow:var(--sh)}
.panel h2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:1rem;margin:0 2px 12px;font-weight:800}
.panel h2 small{color:var(--acc);font-weight:700;font-size:.8rem}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px 6px}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;color:var(--fg);cursor:pointer;padding:0;font:inherit;position:relative}
.sw .c{width:56px;height:56px;border-radius:50%;background:var(--c);border:1px solid rgba(0,0,0,.18);box-shadow:inset 0 -6px 10px rgba(0,0,0,.14),inset 0 5px 8px rgba(255,255,255,.35),0 3px 8px rgba(0,0,0,.14);transition:transform .18s,box-shadow .18s;position:relative}
.sw:hover .c{transform:translateY(-2px)}
.sw:active .c{transform:scale(.92)}
.sw.on .c{outline:3px solid var(--acc);outline-offset:3px}
.sw.on .c:after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font:800 1.1rem var(--font);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.sw em{font:600 .66rem/1.15 var(--font);font-style:normal;color:var(--mut);text-align:center}
.sw.on em{color:var(--fg)}
.c.g{background-image:radial-gradient(circle,#fff 1.2px,transparent 1.8px),radial-gradient(circle,var(--s) 1px,transparent 1.6px),linear-gradient(135deg,var(--c),var(--c));background-size:9px 9px,6px 6px,100% 100%;background-position:0 0,3px 4px,0 0;animation:shim 2.4s linear infinite}
@keyframes shim{to{background-position:9px 9px,9px 10px,0 0}}
.c.rb{background:conic-gradient(red,orange,yellow,lime,cyan,blue,magenta,red)}
.c.rb input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border-radius:50%}
.sum{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.sum span{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 10px 5px 6px;font-size:.7rem;font-weight:600;color:var(--mut)}
.sum span i{width:12px;height:12px;border-radius:50%;background:var(--c);border:1px solid rgba(0,0,0,.25)}
.sum b{color:var(--fg);font-weight:700}
.acts{display:flex;gap:8px;margin-top:14px}
.acts button,.acts a{flex:1;text-align:center;text-decoration:none;padding:13px 10px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:700 .85rem var(--font);cursor:pointer;transition:.15s}
.acts button:active,.acts a:active{transform:scale(.97)}
.acts .p{background:linear-gradient(90deg,var(--acc),var(--acc2));border:0;color:#fff}
.acts .w{background:#1fa855;border:0;color:#fff}
@media(min-width:880px){.app{max-width:1060px;display:grid;grid-template-columns:1.2fr 1fr;gap:6px 28px;align-items:start}header{grid-column:1/-1}.left{position:sticky;top:16px}.tabs{flex-wrap:wrap;overflow:visible;padding-top:0}}
.stage{touch-action:manipulation}
#stk{position:absolute;inset:0;z-index:2}
.stk{position:absolute;transform:translate(-50%,-50%) rotate(-8deg);line-height:1;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1px #fff) drop-shadow(0 3px 3px rgba(0,0,0,.45))}
.stk img{width:100%;display:block;pointer-events:none}
.stk.sel{outline:2px dashed var(--acc);outline-offset:6px;border-radius:12px}
.opts2{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.sk .c{display:grid;place-items:center;font-size:1.9rem;background:var(--bg2);box-shadow:none}
.sk:hover .c{transform:scale(1.12) rotate(-6deg)}
.srow{display:flex;gap:10px;margin-top:12px;justify-content:space-between}
.c.sm{display:grid;place-items:center;font-size:1.3rem;width:48px;height:48px;background:var(--bg2);box-shadow:none}
.c.sm input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.hint{margin:10px 0 2px;text-align:center;color:var(--mut);font-size:.8rem}
.tab{font-size:.9rem}.tab.on{transform:translateY(-2px) rotate(-1.5deg)}
.sw.on .c{animation:pop .4s ease}@keyframes pop{50%{transform:scale(1.18)}}
h1 span{filter:drop-shadow(0 2px 0 rgba(0,0,0,.08))}
#rot{transition:transform .32s ease-in;transform-origin:50% 50%;position:relative}
#cw{position:relative}#cw.fl{transform:scaleX(-1)}
.stage{perspective:1100px}
.pin.lbl{width:auto;height:auto;margin:0;padding:6px 10px;border-radius:99px;transform:translate(-50%,-50%);font:700 .68rem/1 var(--font);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.65);opacity:1;white-space:nowrap;border:2px solid #fff}
.pin.lbl:before{display:none}.pin.lbl.on{transform:translate(-50%,-50%) scale(1.12)}
.zon #tag{display:none!important}
.c.two{background:linear-gradient(135deg,var(--c) 50%,var(--c2) 50%)}
.mseg{display:flex;gap:6px;margin-top:10px}
.mseg button{border:1px solid var(--line);background:var(--card);color:var(--fg);font:700 .82rem var(--font);padding:9px 14px;border-radius:99px;cursor:pointer;transition:.2s}
.mseg button.on{background:linear-gradient(90deg,var(--acc),var(--acc2));border:0;color:#fff;transform:translateY(-1px)}
.badge{position:absolute;top:12px;right:12px;z-index:5;background:var(--acc2);color:#fff;font:700 .72rem/1 var(--font);padding:7px 11px;border-radius:99px}
.seg2{grid-column:1/-1;display:flex;gap:6px;margin-bottom:4px}
.seg2 button{flex:1;border:2px solid var(--line);background:transparent;color:var(--fg);border-radius:12px;padding:10px 4px;font:700 .78rem var(--font);cursor:pointer}
.seg2 button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.hintp{grid-column:1/-1;margin:0 0 6px;color:var(--mut);font-size:.78rem}
.stage.ld canvas{opacity:.4;transition:opacity .2s}
.opts{align-items:start}

/* ===== pastel redesign ===== */
body{background:radial-gradient(700px 480px at 0% -5%,rgba(255,190,220,.55),transparent),radial-gradient(760px 520px at 105% 0%,rgba(190,215,255,.55),transparent),radial-gradient(700px 500px at 50% 110%,rgba(200,245,225,.5),transparent),var(--bg)}
h1{font-weight:700;letter-spacing:-.01em;color:var(--fg)}
h1 span{background:linear-gradient(90deg,#ff8fbc,#b79bff 55%,#7fc8ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:none}
header p{color:var(--mut);font-weight:500}
.stage{border-radius:32px;border:6px solid #fff;box-shadow:0 18px 44px rgba(175,145,215,.28),0 2px 0 rgba(255,255,255,.8) inset;background:#eceaf2}

.stage:after{background:radial-gradient(120% 90% at 50% 40%,transparent 62%,rgba(150,120,200,.14))}
/* floating buttons on the photo */
.hold{background:rgba(255,255,255,.82);color:#6b5a93;border:1.5px solid rgba(255,255,255,.9);box-shadow:0 6px 16px rgba(160,130,200,.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font:600 .76rem/1 var(--font);padding:10px 15px;border-radius:99px;transition:transform .18s,box-shadow .18s,background .18s}
.hold:hover{transform:translateY(-2px);background:#fff;box-shadow:0 10px 22px rgba(160,130,200,.36)}
.hold:active{transform:scale(.95)}
.badge{background:linear-gradient(90deg,#ff9ec4,#b9a2ff);box-shadow:0 6px 14px rgba(185,162,255,.5)}
.pin{border-color:#fff;opacity:.9}
.pin.on{border-color:#ff8fbc}.pin.on:before{border-color:#ff8fbc}
.tag{background:#fff;color:#6b5a93;box-shadow:0 6px 16px rgba(160,130,200,.35)}
/* model switch */
.mseg{gap:8px;margin-top:12px}
.mseg button{background:#fff;border:2px solid var(--line);color:var(--mut);padding:10px 16px;border-radius:99px;box-shadow:0 4px 12px rgba(175,145,215,.15);transition:.2s}
.mseg button:hover{transform:translateY(-2px);border-color:#ffc6dd;color:var(--fg)}
.mseg button.on{background:linear-gradient(135deg,#ffb3d1,#c4b0ff);border:2px solid #fff;color:#fff;text-shadow:0 1px 2px rgba(120,90,180,.35);box-shadow:0 8px 18px rgba(190,160,255,.45);transform:none}
/* part tabs */
.tabs{gap:10px;padding:18px 4px 12px}
.tab{background:#fff;border:2px solid var(--line);color:var(--fg);padding:9px 16px 9px 11px;border-radius:99px;box-shadow:0 4px 12px rgba(175,145,215,.14);font-weight:600;transition:transform .2s,box-shadow .2s,background .2s}
.tab:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(175,145,215,.24)}
.tab i{width:18px;height:18px;border:2px solid #fff;box-shadow:0 1px 4px rgba(120,90,160,.35)}
.tab.on{background:linear-gradient(135deg,#ffc2dc,#d2c3ff);border-color:#fff;color:#4a3f66;transform:translateY(-2px);box-shadow:0 10px 22px rgba(190,160,255,.5)}
.tab.on i{box-shadow:0 0 0 3px rgba(255,255,255,.9)}
/* panel */
.panel{border:2px solid #fff;border-radius:28px;padding:18px 16px 14px;background:rgba(255,255,255,.88);box-shadow:var(--sh);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

.panel h2{font-weight:700;color:var(--fg)}
.panel h2 small{color:#ff8fbc;background:#fff0f6;padding:4px 10px;border-radius:99px;font-weight:600}
.opts{gap:14px 6px}
.sw .c{width:58px;height:58px;border:3px solid #fff;box-shadow:0 6px 14px rgba(150,120,190,.28),inset 0 -6px 10px rgba(0,0,0,.08),inset 0 5px 8px rgba(255,255,255,.45);transition:transform .2s cubic-bezier(.3,1.6,.5,1),box-shadow .2s}
.sw:hover .c{transform:translateY(-3px) scale(1.06);box-shadow:0 12px 20px rgba(150,120,190,.36),inset 0 5px 8px rgba(255,255,255,.45)}
.sw.on .c{outline:3px solid #ff9ec4;outline-offset:3px;transform:scale(1.04)}
.sw.on .c:after{content:"✓";font-size:1.15rem}
.sw em{font-weight:600;color:var(--mut)}
.sw.on em{color:#ff6fa6;font-weight:700}
.sk .c,.c.sm{background:linear-gradient(135deg,#fff0f6,#efe8ff);border:3px solid #fff}
/* tiras style segments */
.seg2 button{border:2px solid var(--line);background:#fff;color:var(--mut);border-radius:16px;padding:11px 4px;box-shadow:0 4px 10px rgba(175,145,215,.12);transition:.2s}
.seg2 button:hover{transform:translateY(-2px)}
.seg2 button.on{border-color:#fff;background:linear-gradient(135deg,#ffd0e4,#dcd0ff);color:#4a3f66;box-shadow:0 8px 16px rgba(190,160,255,.4)}
/* summary chips */
.sum span{background:#fff;border:2px solid var(--line);color:var(--mut);box-shadow:0 3px 8px rgba(175,145,215,.12)}
.sum b{color:var(--fg)}
/* action buttons */
.acts{gap:10px}
.acts button,.acts a{border:2px solid #fff;border-radius:20px;padding:14px 10px;font-weight:700;background:#fff;color:#7a68a8;box-shadow:0 6px 16px rgba(175,145,215,.22);transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .18s}
.acts button:hover,.acts a:hover{transform:translateY(-3px);box-shadow:0 12px 22px rgba(175,145,215,.32)}
.acts button:active,.acts a:active{transform:scale(.96)}
.acts .p{background:linear-gradient(135deg,#ffb3d1,#c4b0ff);color:#fff;text-shadow:0 1px 2px rgba(120,90,180,.35);border:2px solid #fff;box-shadow:0 10px 22px rgba(190,160,255,.5)}
.acts .w{background:linear-gradient(135deg,#9be8c0,#7fd6e6);color:#fff;text-shadow:0 1px 2px rgba(40,120,110,.4);border:2px solid #fff;box-shadow:0 10px 22px rgba(120,214,200,.5)}
.hint,.hintp{color:var(--mut)}

/* ===== stronger, readable buttons ===== */
:root{--btn1:#f2559b;--btn2:#8f63f2;--ink:#3d2f63}
.mseg button{background:#fff;border:2.5px solid #d9c9f5;color:#5b4796;font-weight:700;box-shadow:0 5px 0 #e6daf9}
.mseg button:hover{border-color:#b79cf0;transform:translateY(-2px);color:#3d2f63}
.mseg button.on{background:linear-gradient(135deg,var(--btn1),var(--btn2));border:2.5px solid #fff;color:#fff;text-shadow:0 1px 2px rgba(60,20,110,.55);box-shadow:0 6px 0 #6f48cf,0 12px 22px rgba(143,99,242,.45)}
.tab{background:#fff;border:2.5px solid #dccdf6;color:#4b3b82;font-weight:700;box-shadow:0 4px 0 #e8def9}
.tab:hover{border-color:#b79cf0;transform:translateY(-2px)}
.tab i{border:2px solid #cdbbf0;box-shadow:none}
.tab.on{background:linear-gradient(135deg,var(--btn1),var(--btn2));border:2.5px solid #fff;color:#fff;text-shadow:0 1px 2px rgba(60,20,110,.55);box-shadow:0 5px 0 #6f48cf,0 12px 22px rgba(143,99,242,.45);transform:translateY(-2px)}
.tab.on i{border:2px solid #fff;box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.seg2 button{background:#fff;border:2.5px solid #dccdf6;color:#5b4796;font-weight:700;box-shadow:0 4px 0 #e8def9}
.seg2 button.on{background:linear-gradient(135deg,var(--btn1),var(--btn2));border:2.5px solid #fff;color:#fff;text-shadow:0 1px 2px rgba(60,20,110,.55);box-shadow:0 5px 0 #6f48cf,0 10px 18px rgba(143,99,242,.4)}
.acts button,.acts a{font-size:.95rem;border:2.5px solid #fff;border-radius:20px;padding:15px 10px;font-weight:800;letter-spacing:.01em}
.acts .p{background:linear-gradient(135deg,var(--btn1),var(--btn2));color:#fff;text-shadow:0 1px 2px rgba(60,20,110,.55);box-shadow:0 6px 0 #6f48cf,0 14px 24px rgba(143,99,242,.45)}
#rst{background:#efe6ff;border:2.5px solid #c9b3f5;color:#4b3b82;box-shadow:0 6px 0 #d9c9f5}
.acts .w{background:linear-gradient(135deg,#1fbf7a,#12a3b4);color:#fff;text-shadow:0 1px 2px rgba(0,70,60,.5);box-shadow:0 6px 0 #0d8a74,0 14px 24px rgba(18,163,180,.4)}
.acts button:hover,.acts a:hover{transform:translateY(-3px)}
.acts button:active,.acts a:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
/* buttons on the photo: each with its own colour */
.hold{color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(40,20,80,.5);border:2.5px solid #fff;backdrop-filter:none;-webkit-backdrop-filter:none}
#zbtn{background:linear-gradient(135deg,#27b5d9,#4f8cf0);box-shadow:0 4px 0 #2f66c4,0 8px 16px rgba(60,120,230,.4)}
#spin{background:linear-gradient(135deg,#a07af5,#7f5be8);box-shadow:0 4px 0 #5b3fc2,0 8px 16px rgba(127,91,232,.4)}
#hold{background:linear-gradient(135deg,#ff7aa8,#f2559b);box-shadow:0 4px 0 #c43479,0 8px 16px rgba(242,85,155,.4)}
.hold:hover{background:inherit;filter:brightness(1.07);transform:translateY(-2px)}
.hold:active{transform:translateY(3px)}
/* readable labels */
.sw em{color:#6a5b99;font-weight:700}
.sw.on em{color:#d63a82}
.panel h2 small{color:#c02f78;background:#ffe3f0;border:1.5px solid #ffc2dd}
.sum span{color:#6a5b99;border-color:#e3d6f7}
.sw.on .c{outline:3.5px solid #f2559b}

/* ===== title ===== */
header{margin:4px 2px 18px}
.tag-pill{display:flex;width:max-content;align-items:center;gap:6px;background:linear-gradient(135deg,#ffd45e,#ffae5e);color:#7a3d00;font:700 .72rem/1 var(--font);letter-spacing:.08em;text-transform:uppercase;padding:7px 12px;border-radius:99px;border:2px solid #fff;box-shadow:0 4px 0 #e08a2e,0 8px 14px rgba(255,170,80,.35);transform:rotate(-2deg);margin-bottom:12px}
.ttl-wrap{position:relative;display:inline-block;padding:2px 26px 14px 4px}
h1.ttl{font:700 clamp(2.2rem,7vw,3.6rem)/1.02 var(--font);letter-spacing:-.01em;margin:0;animation:ttlin .8s cubic-bezier(.3,1.5,.5,1) both}
@keyframes ttlin{from{opacity:0;transform:translateY(14px) scale(.96)}}
.ttl .w1,.ttl .w2{display:inline-block;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(2.5px 0 0 #fff) drop-shadow(-2.5px 0 0 #fff) drop-shadow(0 2.5px 0 #fff) drop-shadow(0 -2.5px 0 #fff) drop-shadow(0 6px 0 rgba(143,99,242,.35)) drop-shadow(0 12px 14px rgba(143,99,242,.25))}
.ttl .w1{background-image:linear-gradient(100deg,#7b4fe0,#c05bd8 60%,#f2559b)}
.ttl .w2{background-image:linear-gradient(100deg,#ff5f9e,#ff9a5e 40%,#ffc93c 70%,#43c8a8);transform:rotate(-2deg);transform-origin:left bottom;animation:wob 3.2s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(1.5deg) translateY(-2px)}}
.wave{position:absolute;left:4px;right:20px;bottom:0;width:calc(100% - 24px);height:12px;opacity:.95}
.spk{position:absolute;width:22px;height:22px;filter:drop-shadow(0 2px 3px rgba(120,90,160,.3));animation:tw 2.4s ease-in-out infinite}
.s1{right:-4px;top:-8px}.s2{left:-14px;bottom:20px;width:16px;height:16px;animation-delay:.8s}.s3{right:34%;top:-16px;width:15px;height:15px;animation-delay:1.5s}

function burst(x,y){const cs=['#ff3d81','#ffd60a','#2563eb','#2a9d4b','#fb8500','#7c5cff'];for(let i=0;i<18;i++){const e=document.createElement('i');e.style.cssText=`position:fixed;left:${x}px;top:${y}px;width:9px;height:9px;border-radius:${i%2?'50%':'2px'};background:${cs[i%6]};pointer-events:none;z-index:99`;document.body.appendChild(e);const a=Math.random()*6.28,d=40+Math.random()*80;e.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+34}px) rotate(${Math.random()*360}deg) scale(.4)`,opacity:0}],{duration:700+Math.random()*300,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>e.remove()}}

async function loadModel(name){busy=true;MK=name;PM=META[name];SEL=new Set(PM.sel);const mm=MODELS[name];$('#stage').classList.add('ld');
 document.querySelectorAll('#mseg button').forEach(b=>b.classList.toggle('on',b.dataset.m===name));

 data={};tw={};cur={};state={};stk=[];stkSel=-1;side='out';showZones=false;showOrig=false;sel='suela';TST.out='none';
 $('#cw').classList.remove('fl');$('#spin').textContent='Ver lado de adentro';$('#sidebadge').style.display='none';$('#zbtn').textContent='Ver zonas';$('#stage').classList.remove('zon');$('#rot').style.transform='';
 PARTS=buildParts(name);CP=PARTS.filter(p=>!p.stk);

 const sA=new Float32Array(W*H);for(const k in data){if(SEL.has(k))continue;const d=data[k];d.idx.forEach((i,j)=>sA[i]+=d.a[j])}

  d.idx.forEach((i,j)=>{if(!SEL.has(k))d.a[j]/=Math.max(1,sA[i]);if(sl&&d.a[j]>.5)sliceId[i]=+k.slice(2);if(isAg||sl)return;if(d.a[j]>best[i]){best[i]=d.a[j];owner[i]=pi}})}
 for(const k in data)if(!SEL.has(k))cur[k]=hex('#ffffff');
 CP.forEach(p=>{const o=p.o[dflt(p)];if(p.k==='tiras')TS.out=TS.in=o;else state[p.k]=o});

 // pins
